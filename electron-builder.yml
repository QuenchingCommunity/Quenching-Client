appId: com.quenching.mod.client
productName: QMClient

directories:
  output: __Bin

files:
  - dist/**/*
  - "!dist/statics/**/*"
  - "!dist/**/*.map"
  - package.json
  - release-version.json
  - "!**/[oO][fF][fF][lL][iI][nN][eE].[eE][xX][eE]"

extraResources:
  - from: dist/statics
    to: statics
    filter:
      - "**/*"
      - "!**/[oO][fF][fF][lL][iI][nN][eE].[eE][xX][eE]"
  - from: assets
    to: assets
    filter:
      - "**/*"
      - "!**/[oO][fF][fF][lL][iI][nN][eE].[eE][xX][eE]"
      - "!quenching{,/**/*}"
      - "quenching/{ui-misc.txt,1.ico,logo.png,update-public-key.pem,index.html,local-release.json,PostProcessingConfig.txt,resources-core.7z,resources-ui.7z,resources-terrain.7z,resources-foliage-color.7z,resources-foliage-detail.7z,resources.manifest.json}"
      - "quenching/update-baselines{,/**/*}"
      - "!backup{,/**/*}"
      - "!unpacked{,/**/*}"

win:
  # Smart App Control also validates PE native addons, not only QMClient.exe.
  signExts: [".node", ".dll"]
  signtoolOptions:
    signingHashAlgorithms: ["sha256"]
  files:
    # Keep this matcher inclusive: an exclusions-only platform matcher makes
    # electron-builder prepend **/* alongside the shared runtime allowlist.
    - package.json
    - "!node_modules/@jamiephan/{casclib,stormlib}/prebuilds/{linux-*,darwin-*,win32-arm64,win32-ia32}/**/*"
    - "!node_modules/7zip-bin-full/mac/**/*"
    - "!node_modules/7zip-bin-full/linux/**/*"
    - "!node_modules/7zip-bin-full/win/{arm,arm64,ia32}/**/*"
    - "!node_modules/7zip-bin-full/win/x64/7zc/**/*"
  icon: assets/quenching/1.ico
  target:
    - target: dir
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: QM

mac:
  icon: public/logo.png
  category: public.app-category.games
  target: dir
  # Ad hoc signing on macOS. Developer ID notarization is a separate release step.
  identity: '-'
  electronLanguages: ['en', 'zh', 'zh_CN']

# 禁用 FFMPEG 替换，使用 Electron 自带的库，避免库路径问题
downloadAlternateFFmpeg: false

asar: true
beforePack: scripts/check-mac-native-before-pack.cjs
afterPack: scripts/windows-native-signing.cjs
afterSign: scripts/check-windows-signatures.cjs

# @jamiephan/stormlib ships N-API prebuilds, but its npm package does not ship
# thirdparty/StormLib sources required by node-gyp rebuild. Rebuilding during
# electron-builder therefore fails with missing StormLib.h; use the prebuild.
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
asarUnpack:
  - node_modules/7zip-bin-full/**/*
  - node_modules/@jamiephan/stormlib/prebuilds/**/*.node
  - node_modules/@jamiephan/stormlib/build/**/*.node
  - node_modules/@jamiephan/casclib/prebuilds/**/*.node
  - node_modules/@jamiephan/casclib/build/**/*.node
