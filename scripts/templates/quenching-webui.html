<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Quenching {{QUENCHING_DISPLAY_VERSION}} UI</title>
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0, minimal-ui" />
    <script>window.__DEBUG = new Boolean('').valueOf();</script>
    <style>
        #QuenchingNotice { position: absolute; left: 15px; top: 0; z-index: 0; display: inline-block; line-height: 0; }
        #Quenching1 { display: block; height: 350px; width: auto; }
        #QuenchingVersion { position: absolute; left: 0; right: 0; top: 85%; color: #b4b4b4;
            font: 300 16px/1.2 "Segoe UI", "Microsoft YaHei", sans-serif;
            text-align: center; white-space: nowrap; text-shadow: 0 1px 3px #000; pointer-events: none; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="portal"></div>
    <div id="QuenchingNotice">
        <img id="Quenching1" src="QuenchingOn.png" height="350" alt="Quenching" />
        <span id="QuenchingVersion" data-quenching-version="{{QUENCHING_DISPLAY_VERSION}}">Version {{QUENCHING_DISPLAY_VERSION}} By 天下正义</span>
    </div>
    <img id="Quenching2" src=".\icons\close-icon-disabled.png" width="35" height="35"
         style="position: absolute;left: 60px; top: 85px;z-index: 0;" onclick="cque()" />
    <script>
        var logCalls = [];
        var w3cClientVersion = 1;
        console.origLog = console.log;
        console.log = (...args) => {
            logCalls.push(...args);
            console.origLog("log");
            console.origLog(...args);
        };
    </script>
    <script src="GlueManager.js"></script>
    <script>
        function cque() {
            ["QuenchingNotice", "Quenching2", "Quenching3"].forEach(function (id) {
                var element = document.getElementById(id);
                if (element) element.style.display = "none";
            });
        }
        function lque() {
            var element = document.getElementById("Quenching3");
            if (element) element.style.display = "none";
        }
    </script>
</body>
</html>
